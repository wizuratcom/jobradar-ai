name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobradar_test
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@localhost:5432/jobradar_test
      TEST_DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@localhost:5432/jobradar_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest
